description: >
  Multi-dimensional deforestation risk prediction combining satellite imagery, climate,
  demographics, conflict, economic, political, and cultural data. Triple ablation study
  (dimension × temporal scale × spatial resolution) with SHAP interpretability.
long_description: >
  This project develops a comprehensive machine learning framework for predicting
  deforestation risk across the Congo Basin — the world's second-largest tropical forest.


  Unlike traditional approaches that rely on a few satellite-derived features, we integrate
  33 heterogeneous data sources spanning 8 thematic dimensions: land cover (Hansen GFC,
  Sentinel-2), topography (SRTM), climate (CHIRPS, ERA5), night lights (VIIRS),
  demographics (WorldPop), armed conflict (ACLED), governance (V-Dem), economics (WDI),
  and commodity prices.


  The core contribution is a triple ablation study that systematically evaluates the
  impact of each dimension, temporal window, and spatial resolution on prediction accuracy.
  SHAP (SHapley Additive exPlanations) provides feature-level interpretability, revealing
  which factors drive deforestation in different regions.


  A Streamlit dashboard enables interactive exploration of predictions and SHAP values
  across the study area.
