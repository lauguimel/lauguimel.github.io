title: "RheoDrop"
subtitle: "What if a simple droplet could reveal the nature of a fluid?"
date_start: 2016
date_end: null
tags: [fluid-mechanics, deep-learning, rheology, AI]
thumbnail: "/images/projects/rheodrop/thumbnail.jpg"
description: >
  Can we identify a fluid's properties just by watching it form droplets?
  RheoDrop uses AI to answer this question, turning inkjet images into
  a fast, contactless rheological measurement.
long_description: >
  When a thin jet of liquid breaks into droplets — a phenomenon known as the
  Rayleigh-Plateau instability — the shape of each drop carries a fingerprint
  of the fluid's viscosity, surface tension, and density. In continuous inkjet
  (CIJ) printing, this breakup is extremely repeatable, producing thousands of
  nearly identical droplets per second.


  The idea behind RheoDrop is simple: if the drop shape depends on the fluid
  properties, can we work backwards — observe the drops, and let a neural network
  figure out what the fluid is made of? This is exactly what we do. We train
  deep learning models on images of jets and droplets, and the network learns
  to predict fluid properties directly from what it sees.


  This approach replaces expensive and time-consuming laboratory rheometry with
  a camera and an algorithm. It works on Newtonian fluids today, and we are now
  pushing towards non-Newtonian fluids using generative models (variational
  autoencoders) that can discover hidden rheological features without being told
  what to look for. The technology is patented and in pre-commercialisation.


