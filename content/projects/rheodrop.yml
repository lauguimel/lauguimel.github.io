description: >
  Machine learning framework for identifying fluid rheological properties
  (viscosity, surface tension, density) from high-speed images of inkjet
  drop formation using the Rayleigh-Plateau instability.
long_description: >
  RheoDrop leverages the Rayleigh-Plateau instability in continuous inkjet (CIJ)
  printing to identify fluid properties without conventional rheometry. By analyzing
  the morphology of a jet breaking into droplets, convolutional neural networks
  can infer viscosity, surface tension, and density simultaneously.


  The project has three phases. Phase 1 (2022) demonstrated proof of concept on
  numerical data, achieving MAPE < 1% for viscosity identification using DNNs trained
  on Basilisk CFD simulations. Phase 2 (2025) extended this to real experimental data
  from a Markem-Imaje piezoelectric CIJ printer with 10 Newtonian fluids, reaching
  98.5% classification accuracy and MAPE < 1% for viscosity and density.


  Phase 3 (ongoing) explores conditional Beta-VAE architectures for unsupervised
  discovery of rheological properties in non-Newtonian fluids, moving beyond
  supervised classification to continuous property estimation in latent space.


