tags: [machine-learning, rheology, inkjet, cij, fluid-mechanics, cnn]
thumbnail: "/images/projects/rheodrop.jpg"
description: >
  Development of a novel rheometric approach based on continuous inkjet (CIJ) printing
  combined with machine learning. By analyzing jet breakup patterns, we can identify
  fluid rheological properties non-intrusively. This includes comprehensive experimental
  datasets, numerical simulations of Newtonian and non-Newtonian jets, and CNN-based
  classification of fluid types. A patent was filed for this method.
