description: >
  Most fluids we encounter daily — water, oil — flow in predictable ways.
  But add a tiny amount of polymer, and the fluid develops a "memory" that
  produces unexpected behaviors in microchannels: asymmetric flows, particle
  sorting, and counter-intuitive thermal effects. We study these phenomena
  through simulation and experiment.
long_description: >
  Viscoelastic fluids are everywhere — from shampoo to blood to industrial
  coatings. What makes them special is that they remember their recent
  deformation history, which causes them to behave in ways that Newtonian
  fluids (like water) simply cannot.


  In microfluidic channels — tiny devices the width of a hair — these memory
  effects become dominant. A symmetric channel can produce an asymmetric flow.
  Suspended particles can migrate toward the walls instead of the center. And
  a gentle temperature change can paradoxically speed up the flow rather than
  slow it down.


  We study these surprising phenomena by combining numerical simulation
  (OpenFOAM, RheoTool) with microfluidic experiments. The goal is both
  fundamental — understanding the physics that govern these flows — and
  practical: viscoelastic effects can be harnessed to sort particles, mix
  fluids, or design thermally tunable microfluidic devices without moving
  parts.


  A key challenge is that the mathematical models used to describe these
  fluids are imperfect. By carefully comparing simulations with experiments,
  we can test which models capture reality and which fall short — using the
  flow itself as a sieve for constitutive equations.
