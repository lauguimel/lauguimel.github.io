description: >
  Research on viscoelastic fluid dynamics including flow asymmetry in confined geometries,
  particle migration in microfluidic channels, thermal control of secondary flows, and
  natural convection with non-Newtonian fluids. Combines OpenFOAM/RheoTool simulations
  with experimental microfluidics and rheometry.
long_description: >
  Viscoelastic fluids exhibit complex flow behaviors that can be harnessed for precise particle
  manipulation in microfluidic devices. This research program spans several interconnected themes.


  **Flow asymmetry enhanced by viscoelasticity.** In collaboration with V. ChandraShekar and
  H. Bodiguel, we investigate how elastic instabilities break the expected symmetry of the
  velocity field in confined channel flows. Our experimental and numerical studies map the
  parameter space where such transitions occur, and provide a framework to discriminate between
  viscoelastic constitutive models based on their ability to reproduce the observed asymmetry.


  **Particle migration and reversal.** Working with X. Salas-Barzola, C. de Loubens,
  A. Naillon, E. Santanach Carreras, and H. Bodiguel, we study how elastic normal stresses
  drive lateral migration of suspended particles in pressure-driven viscoelastic flows. A key
  finding is the reversal of the migration direction at high solvent viscosity ratios: particles
  can migrate toward the wall instead of the centerline, depending on the balance between solvent
  and polymer contributions to the stress tensor. We have also developed methods to quantify the
  first normal stress difference in shear-thinning viscoelastic fluids by analyzing particle
  focusing dynamics, providing a new rheometric technique based on microfluidic observations.


  **Thermal control of viscoelastic microflows.** Temperature offers a largely unexplored lever
  to control viscoelastic microflows. Our work on thermal restructuring demonstrates that moderate
  temperature gradients can dramatically alter the velocity profile and secondary flow patterns
  in polymer solutions, with weaker thermal forcing sometimes producing faster flows — a
  counter-intuitive result arising from the nonlinear coupling between viscosity, elasticity,
  and temperature. These findings open new avenues for thermally tunable microfluidic devices.


  **Natural convection in viscoelastic fluids.** Using OpenFOAM with the RheoTool library
  (rheoHeatFoam solver), we conduct large parameter sweeps across Prandtl number (0.71–1000),
  Rayleigh number (1e3–1e7), and rheological contrast, studying both Newtonian and viscoelastic
  regimes on HPC clusters. This work extends classical Rayleigh-Bénard convection theory to
  complex fluids.
