description: >
  Modular ecosystem integrating AI models into CFD workflows. Includes a model hub
  (kraken-hub) for ONNX-based rheological models and an expert system (kraken-foam)
  for automated OpenFOAM case setup.
long_description: >
  Kraken-hub is the central model catalogue and distribution layer of the Kraken ecosystem.
  It provides a standardized pipeline to convert PyTorch models to ONNX format for deployment
  inside OpenFOAM solvers, covering turbulence (TBNN, FIML, BNNRANS), rheology (ICNN), and
  operator learning models. Each model is documented with a Pydantic-validated model card,
  round-trip validated against the original PyTorch output, and shipped with reproducible
  OpenFOAM benchmark cases. The catalogue currently tracks over 30 models across four tiers
  of exportability, with roles spanning Reynolds stress anisotropy, source-term corrections,
  viscosity models, wall functions, and constitutive laws for solid mechanics.


  Kraken-foam is a CFD expert system organized in three layers. The pre-simulation layer uses
  decision trees compiled from 30–50 curated research papers to recommend the appropriate
  solver, numerical schemes, and parameters for a given problem — avoiding common pitfalls
  such as enthalpy-dominated buoyancy crashes in atmospheric simulations. The monitoring layer
  provides real-time surveillance of running simulations through OpenFOAM function objects,
  detecting NaN divergence, CFL violations, oscillation, and convergence stalls, with
  automatic recovery strategies. The post-evaluation layer assesses result quality against
  the user's engineering objectives.


  The broader Kraken vision is to bridge the gap between machine learning research and
  production CFD workflows. By standardizing model export (ONNX opset 18), providing
  benchmark-validated deployment, and automating case setup through expert knowledge,
  Kraken aims to make AI-augmented simulation accessible to engineers without ML expertise.
  The ecosystem is designed for HPC deployment, with Docker containers for reproducibility
  and integration with parameter sweep tools (kraken-sim) for large-scale studies.
