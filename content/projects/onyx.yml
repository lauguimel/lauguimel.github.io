description: >
  Running a fluid dynamics simulation requires years of expertise to set up
  correctly. Onyx is an AI-powered toolkit that helps engineers configure,
  run, and monitor simulations — and inject machine learning models directly
  into the physics solver.
long_description: >
  Computational fluid dynamics (CFD) is a powerful tool, but it comes with a
  steep learning curve. Choosing the right solver, mesh, numerical schemes, and
  turbulence model requires deep expertise — and a single bad choice can make
  a simulation crash or produce misleading results.


  Onyx tackles this problem on two fronts. First, it acts as an **expert system**:
  drawing on knowledge distilled from dozens of research papers, it recommends
  simulation settings, monitors the run in real time, and catches common failures
  (divergence, numerical oscillations) before the engineer even notices.


  Second, Onyx provides a **model hub** — a library of AI models that can be
  plugged directly into OpenFOAM simulations. These neural networks can replace
  or augment traditional physics models: predicting turbulence more accurately,
  modelling complex rheological behavior, or correcting wall boundary conditions.
  All models are validated against reference solutions before deployment.


  The ambition is to lower the barrier between machine learning research and
  everyday engineering simulation, making AI-augmented CFD practical and reliable.
