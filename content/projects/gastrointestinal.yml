thumbnail: "/images/projects/gastrointestinal/method.png"
description: >
  Digestive disorders affect millions, yet diagnosis often relies on subjective
  interpretation of medical images. We combine AI-based video analysis with fluid
  mechanics to bring objective, quantitative measures to clinical evaluation.
long_description: >
  When a patient undergoes a video-defecography exam (a real-time X-ray of rectal
  evacuation), a radiologist watches the footage and writes a qualitative report:
  "normal" or "abnormal." But what if we could extract precise, quantitative
  information from those same images?


  That's what we set out to do. Using modern AI segmentation models (SAM 2), we
  automatically track the shape of the rectum frame by frame across thousands of
  patient videos, generating evacuation curves — essentially, a plot of how
  quickly and completely the organ empties over time.


  With nearly 1,500 patients analysed, these curves reveal something surprising:
  about a third of patients labelled "abnormal" by radiologists actually evacuate
  in a perfectly normal way according to objective fluid mechanics criteria. This
  suggests that morphological appearance alone can be misleading, and that
  dynamic, quantitative analysis could improve clinical decision-making.


  We also use unsupervised learning (variational autoencoders) to discover
  natural groupings among patients — letting the data speak rather than
  imposing predefined categories. This work sits at the intersection of fluid
  mechanics, medical imaging, and machine learning.
