tags: [biomechanics, deep-learning, medical-imaging, fluid-mechanics, clinical-data, computer-vision]
thumbnail: "/images/projects/gastrointestinal/evacuation_clusters.png"
description: >
  Large-scale analysis of human defecation mechanics combining deep learning segmentation
  (SAM 2, Detectron2) with computational fluid dynamics modeling on 1488 patients from
  X-ray video-defecography. Identification of distinct kinetic phenotypes that reveal
  discordances between radiological reports and objective evacuation dynamics.
long_description: >
  This project investigates human defecation biomechanics by coupling AI-based image
  analysis with fluid mechanical modeling on a unique clinical dataset of 1488 patients
  (CHU Grenoble, 1999-2005). We developed an automated pipeline using Detectron2 and
  SAM 2 to segment the rectum in X-ray video-defecography sequences, extracting
  time-resolved evacuation curves for each patient.


  Two main research directions are pursued. First, we validated Yang's evacuation time
  law on this large cohort using Bingham rheometry, establishing quantitative benchmarks
  for normal vs. pathological evacuation times. Second, we applied variational
  autoencoders (VAE) with attention mechanisms to discover latent evacuation phenotypes
  through unsupervised temporal clustering. This analysis revealed two distinct kinetic
  populations (evacuators vs. non-evacuators) and showed that 35% of patients with
  "Abnormal" radiological reports actually exhibit kinetically normal evacuation patterns
  -- suggesting systematic over-interpretation of morphological findings in clinical
  practice.


  The segmentation pipeline was upgraded from Detectron2 (Mask R-CNN) to SAM 2 with
  anchor-frame propagation, processing 447 out of 463 eligible patients with improved
  temporal consistency.
