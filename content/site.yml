bio_short: >
  Associate Professor at Grenoble Alpes Université, researcher at Laboratoire Rhéologie et Procédés.
  I work at the interface between fluid mechanics, rheology, and numerical simulation.
bio_long: >
  I am an associate professor at Polytech Grenoble (Materials Department), working at Laboratoire
  Rhéologie et Procédés. What drives my research is the interplay between simulation and experiment:
  building numerical models that capture the physics of complex fluids, then confronting them with
  real-world observations. I enjoy the applied side of engineering science — whether it is predicting
  how a viscoelastic fluid behaves in a microchannel, understanding particle migration phenomena,
  or using machine learning to extract rheological properties from inkjet images.


  My background is rooted in computational mechanics: I did my PhD on micro-macro modelling of
  suspensions using kinetic theory, then worked on structural simulation at CERN and shape memory
  alloy modelling at ÉTS Montréal before joining UGA in 2013. This path gave me a broad toolbox —
  from finite elements to CFD to data-driven methods — that I now apply to problems in rheology,
  microfluidics, and biofluid mechanics.


  Beyond research, I care about teaching mechanics and simulation to engineering students, and about
  building collaborations that bridge disciplines and countries.
