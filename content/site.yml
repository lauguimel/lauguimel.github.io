bio_short: >
  Associate Professor at Grenoble Alpes Université, researcher at Laboratoire Rhéologie et Procédés.
  Expertise in computational fluid dynamics, rheology, and machine learning applied to physical systems.
bio_long: >
  As a multidisciplinary researcher and associate professor at Polytech Grenoble (Materials Department),
  I combine expertise in fluid mechanics, rheology, and data science. My research spans from numerical
  simulation of complex fluids to machine learning applications in geospatial analysis and wind energy.
  I hold a Ph.D. from Université Joseph Fourier on numerical modelling of suspension kinetic theory,
  and have worked at CERN and ÉTS Montréal before joining UGA in 2013.
